[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_mining_framework"]

[project]
name = "verdict-edge"
version = "0.1.0"
description = "Edge Mining Framework — Prediction Market Alpha Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nicholas Carter"}]
dependencies = ["numpy>=1.24"]
keywords = ["prediction-markets", "alpha", "signal-evaluation", "expected-value", "verdict"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6.0.1",
    "code-review-graph>=2.3.7",
]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/verdict/verdict-edge"
Repository = "https://github.com/verdict/verdict-edge"
Issues = "https://github.com/verdict/verdict-edge/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "typings"

[tool.hatch.build.targets.sdist]
exclude = ["/.hypothesis", "/tests", "/typings", "/.github", "/.pytest_cache", "/.ruff_cache", "/.mypy_cache", "/.coverage"]
